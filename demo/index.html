<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TENEBRIS — live demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/demo.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">TENEBRIS<span class="sub">live demo</span></div>
    <div class="phase"><span id="phase-label">SETUP</span><span id="phase-progress" class="prog">1 / 5</span></div>
    <div class="controls">
      <button id="btn-play" class="btn primary">Play</button>
      <button id="btn-next" class="btn">Next phase</button>
      <button id="btn-restart" class="btn">Restart</button>
      <button id="btn-mute" class="btn">Mute</button>
      <label class="speed">speed
        <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1">
        <span id="speed-val">1.0x</span>
      </label>
      <span id="clock" class="clock">0 s</span>
    </div>
  </header>

  <div class="layers">
    <span class="lyr-title">layers</span>
    <label><input type="checkbox" class="layer-toggle" data-layer="pods" checked> Pods</label>
    <label><input type="checkbox" class="layer-toggle" data-layer="decoys" checked> Decoys</label>
    <label><input type="checkbox" class="layer-toggle" data-layer="zones"> Coverage</label>
    <label><input type="checkbox" class="layer-toggle" data-layer="tri"> Triangulation</label>
    <label><input type="checkbox" class="layer-toggle" data-layer="trail" checked> Trajectory</label>
    <label><input type="checkbox" class="layer-toggle" data-layer="cone" checked> Accuracy cone</label>
    <label><input type="checkbox" class="layer-toggle" data-layer="transcript" checked> Transcript</label>
  </div>

  <main class="stage">
    <div id="map"></div>
    <div id="banner" class="banner"></div>
    <div id="transcript" class="transcript"></div>
    <div id="threat-card" class="threat-card"></div>
    <div class="legend">
      <span><i class="dot real"></i> pod</span>
      <span><i class="dot decoy"></i> decoy</span>
      <span><i class="lg master"></i> master</span>
      <span><i class="lg drone"></i> drone</span>
    </div>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/scenario.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
