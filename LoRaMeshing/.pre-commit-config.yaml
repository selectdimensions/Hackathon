repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2048"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, proto, crypto, chore, docs, refactor, test, ci, build]

  - repo: local
    hooks:
      - id: no-priv-keys
        name: refuse staged .priv files
        entry: bash -c 'if git diff --cached --name-only | grep -E "\.(priv|pem|p12)$|/id_[a-z0-9]+$"; then echo "REFUSED: private key staged"; exit 1; fi'
        language: system
        pass_filenames: false
